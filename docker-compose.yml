services:
  gateway-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: gateway-agent:local
    container_name: gateway-agent
    # Server-friendly default: restart after daemon reboot or transient failure unless manually stopped.
    restart: unless-stopped
    # Runtime-only settings live in .env; do not commit real secrets.
    env_file:
      - .env
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      GATEWAY_AUTH_ENABLED: ${GATEWAY_AUTH_ENABLED:-true}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-change-me}
      GATEWAY_API_KEY_HEADER: ${GATEWAY_API_KEY_HEADER:-X-API-Key}
    ports:
      # HOST_PORT is what the server exposes; SERVER_PORT is where Spring listens inside the container.
      - "${HOST_PORT:-8080}:${SERVER_PORT:-8080}"
    healthcheck:
      # Keep /actuator/health public so Docker can check liveness without a gateway API key.
      test: ["CMD-SHELL", "curl -fsS http://localhost:${SERVER_PORT:-8080}/actuator/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

gateway:
  auth:
    enabled: ${GATEWAY_AUTH_ENABLED:true}
    api-key: ${GATEWAY_API_KEY:change-me}
    header-name: ${GATEWAY_API_KEY_HEADER:X-API-Key}
  model-catalog:
    - id: gateway-stub-chat
      object: model
      owned-by: gateway-agent
      route: stub-chat
  routes:
    - route-id: stub-chat
      provider: stub
      channel: chat
      display-name: Stub Chat Provider
      models:
        - gateway-stub-chat
